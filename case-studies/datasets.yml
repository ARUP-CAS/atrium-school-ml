# Where each dataset lives.
#
# This is the ONLY file that changes when a dataset moves, grows, or gains a DOI.
# Notebooks always say `get_dataset("<name>")` and never care about the answer.
#
# source.kind:
#   repo   — a folder committed in this repository (small, public data only)
#   url    — a .zip / .tar.gz fetched once and cached in the persistent home
#   hub    — a directory already mounted on the JupyterHub
#   zenodo — a DOI, resolved to its files (use this once a dataset is archived)
#
# access:
#   public     — anyone can fetch it
#   restricted — not redistributable; `note` tells the participant what to do

